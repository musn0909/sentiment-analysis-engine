<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Engine</title>

   <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <h1>Sentiment Analysis Engine</h1>

        <p class="subtitle">
            Real-Time NLP Sentiment Classification using BERT & FastAPI
        </p>

        <textarea
            id="text-input"
            placeholder="Enter your text here..."
        ></textarea>

        <button onclick="analyzeSentiment()" id="analyze-btn">
            Analyze Sentiment
        </button>

        <div class="loading" id="loading">
            Analyzing Sentiment...
        </div>

        <div class="result-box">

            <h2>Analysis Result</h2>

            <p id="sentiment">Sentiment: --</p>

            <p id="confidence">Confidence: --</p>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
